<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ea">
<title>Nussfänger</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,sans-serif;background:#8fd3ea}
button,select{font:inherit}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:12px;display:flex;align-items:center;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.stats{flex:1;min-width:0;display:grid;gap:5px}
.pill,.hud button{border:0;border-radius:99px;background:#ffffffdc;color:#24372e;padding:7px 11px;font-size:13px;font-weight:700;box-shadow:0 2px 8px #0002}
.health{height:12px;border-radius:20px;background:#ffffffaa;overflow:hidden}
.health span{display:block;width:60%;height:100%;background:#22c55e;transition:width .15s}
.actions{display:flex;gap:6px}
.hud button{padding:8px 10px}
.goal{position:absolute;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 32px));padding:8px 12px;border-radius:14px;background:#ffffffd9;color:#34473d;font-size:12px;pointer-events:none;box-shadow:0 2px 10px #0002}
.goal-top{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:5px}
.track{height:7px;border-radius:10px;background:#0002;overflow:hidden}
.track span{display:block;width:0;height:100%;background:#3b82f6}
#goalText{margin-top:4px}
.overlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));background:#14281f66;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.card{width:min(400px,100%);max-height:100%;overflow:auto;text-align:center;background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 55px #0004}
.card h1{color:#1c3a2a;font-size:25px;margin:0 0 8px}
.card p{color:#4a5a52;font-size:14px;line-height:1.45;margin:8px 0 14px}
.card label{display:block;text-align:left;margin:12px 0 5px;color:#3c5146;font-size:13px;font-weight:700}
.card select,.card button{width:100%;padding:12px;border-radius:12px;border:1px solid #d7e2da;background:#fff;color:#253a2d}
.card button{margin-top:9px;border:0;background:#22c55e;color:white;font-weight:700;cursor:pointer}
.card button.secondary{background:#e8f1eb;color:#294535}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend{display:grid;grid-template-columns:1fr 1fr;text-align:left;gap:6px;font-size:12px;color:#53645a;margin:12px 0}
.small{font-size:12px!important;color:#77857d!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="stats">
    <div class="health" aria-label="Gesundheit"><span id="healthBar"></span></div>
    <div class="pill" id="status">Bereit</div>
  </div>
  <div class="pill" id="score">🌰 0</div>
  <div class="actions">
    <button id="themeBtn" aria-label="Hintergrund wechseln">🌲</button>
    <button id="soundBtn" aria-label="Ton umschalten">🔊</button>
    <button id="pauseBtn" aria-label="Pause">Ⅱ</button>
  </div>
</div>

<div class="goal">
  <div class="goal-top"><span id="levelName">Nussfänger</span><span id="timer">—</span></div>
  <div class="track"><span id="goalBar"></span></div>
  <div id="goalText">Wähle einen Modus und starte das Spiel.</div>
</div>

<div class="overlay show" id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';

const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const $ = s => document.querySelector(s);
const overlay = $('#overlay'), card = $('#card');
const healthBar = $('#healthBar'), scoreEl = $('#score');
const statusEl = $('#status'), levelName = $('#levelName');
const timerEl = $('#timer'), goalBar = $('#goalBar'), goalText = $('#goalText');

const levels = [
  {name:'Aufwärmen', goal:'Fange 12 Nüsse', type:'nuts', target:12, time:45, hazards:false},
  {name:'Gesund werden', goal:'Erreiche 85 Gesundheit', type:'health', target:85, time:45, hazards:false},
  {name:'Steine im Weg', goal:'Fange 18 Nüsse', type:'nuts', target:18, time:50, hazards:true},
  {name:'Combo-Meister', goal:'Fange 10 Nüsse in Folge', type:'combo', target:10, time:40, hazards:false},
  {name:'Ausdauer', goal:'Überlebe 40 Sekunden', type:'survive', target:40, time:40, hazards:true},
  {name:'Boss-Level', goal:'Weiche dem Boss aus und fange 6 Nüsse', type:'boss', target:6, time:35, hazards:true}
];
const themes = [
  {name:'Wald', sky:['#77c6df','#e0f1ce'], ground:'#77ac66', grass:'#60944f', icon:'🌲'},
  {name:'Garten', sky:['#8fd3ea','#fff0ca'], ground:'#8ec27c', grass:'#79b268', icon:'🌼'},
  {name:'Herbst', sky:['#df9d68','#f5d39d'], ground:'#b87843', grass:'#8b5838', icon:'🍂'}
];
const outfits = ['Blau','Rot','Grün','Lila','Gold','Regenbogen'];
const outfitColors = ['#38bdf8','#ef4444','#22c55e','#a855f7','#eab308','#ec4899'];

let W=0,H=0,dpr=1,ground=65,last=0,dragging=false;
let audio=null,musicTimer=null,musicStep=0;
let settings={mode:'campaign',difficulty:'normal',theme:1,sound:true,outfit:0};
let unlocked=load('nf-outfits',[0]);
let best=Number(load('nf-best',0))||0;
const player={x:0,y:0,w:48,h:65,target:null};
const game={
  phase:'menu',level:0,health:60,score:0,combo:0,bestCombo:0,
  time:0,left:0,nuts:0,items:[],particles:[],banner:'',bannerTime:0,
  countdown:0,carrot:0,bossX:0,dodged:0
};
const difficulty={easy:{fall:.82,drain:.72},normal:{fall:1,drain:1},hard:{fall:1.22,drain:1.3}};

function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function current(){return levels[game.level]||levels[0]}
function resize(){
  const r=canvas.getBoundingClientRect(); W=r.width||innerWidth; H=r.height||innerHeight;
  dpr=Math.min(devicePixelRatio||1,2); canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); ground=Math.max(48,Math.min(76,H*.1));
  player.w=clamp(W*.12,38,58); player.h=player.w*1.35;
  player.y=H-ground-player.h; player.x=clamp(player.x||W/2,player.w/2,W-player.w/2);
}
function show(html){card.innerHTML=html;overlay.classList.add('show')}
function hide(){overlay.classList.remove('show')}
function menu(){
  game.phase='menu';
  const opts=outfits.map((o,i)=>`<option value="${i}" ${settings.outfit===i?'selected':''} ${unlocked.includes(i)?'':'disabled'}>${unlocked.includes(i)?o+' Outfit':'🔒 '+o+' Outfit'}</option>`).join('');
  show(`<h1>🌰 Nussfänger</h1>
    <p>Fange Nüsse, weiche Gefahren aus und meistere alle sechs Level.</p>
    <label for="mode">Spielmodus</label><select id="mode"><option value="campaign">Level-Kampagne</option><option value="practice">Übungsmodus ohne Zeitdruck</option></select>
    <label for="difficulty">Schwierigkeit</label><select id="difficulty"><option value="easy">Leicht</option><option value="normal">Normal</option><option value="hard">Schwer</option></select>
    <label for="outfit">Figur und freigeschaltete Outfits</label><select id="outfit">${opts}</select>
    <div class="row"><button data-action="theme">Hintergrund: ${themes[settings.theme].name}</button><button data-action="sound">Ton: ${settings.sound?'An':'Aus'}</button></div>
    <div class="legend"><span>🌰 Nuss: Gesundheit</span><span>🍎 Apfel: Extra-Gesundheit</span><span>🥕 Karotte: schneller</span><span>🪨 Stein / 🐝 Wespe: ausweichen</span></div>
    <p class="small">Rekord: ${best} Punkte. Outfits werden durch Kampagnen-Level freigeschaltet.</p>
    <button data-action="start">Spiel starten</button>`);
  $('#mode').value=settings.mode; $('#difficulty').value=settings.difficulty;
}
function begin(){
  settings.mode=$('#mode')?.value||settings.mode;
  settings.difficulty=$('#difficulty')?.value||settings.difficulty;
  settings.outfit=Number($('#outfit')?.value||0);
  player.x=W/2; game.score=0;game.bestCombo=0;game.dodged=0;
  hide();
  if(settings.mode==='practice'){
    game.level=0;game.health=75;game.nuts=0;game.time=0;game.left=0;
    game.items=[];game.combo=0;game.carrot=0;game.phase='play';
    game.banner='Übungsmodus';game.bannerTime=1.7;
    return;
  }
  startLevel(0);
}
function startLevel(i){
  game.level=i;game.phase='countdown';game.countdown=3;
  game.health=[60,50,65,65,75,85][i];
  game.nuts=0;game.time=0;game.left=current().time;
  game.combo=0;game.items=[];game.carrot=0;
  game.banner='Level '+(i+1)+' · '+current().name;game.bannerTime=2;
}
function pause(){
  if(game.phase==='play'){
    game.phase='paused';
    show(`<h1>Pause</h1><p>Level ${game.level+1}: ${current().name}</p><button data-action="resume">Weiter spielen</button><button class="secondary" data-action="menu">Zum Menü</button>`);
  } else if(game.phase==='paused') hide(),game.phase='play';
}
function finishLevel(){
  game.phase='transition';game.items=[];
  const bonus=25*(game.level+1);game.score+=bonus;
  if(game.level<outfits.length-1&&!unlocked.includes(game.level+1)){
    unlocked.push(game.level+1);save('nf-outfits',unlocked);
    game.banner='Outfit freigeschaltet!';game.bannerTime=2;
  }else{game.banner='Level geschafft! +'+bonus;game.bannerTime=1.6}
}
function gameOver(won=false,reason=''){
  game.phase='over';best=Math.max(best,game.score);save('nf-best',best);
  if(won){
    show(`<h1>🏆 Alle Level geschafft!</h1><p>Du hast die Kampagne beendet und <strong>${game.score}</strong> Punkte gesammelt.</p><p>Beste Combo: ×${game.bestCombo} · Ausgewichene Gefahren: ${game.dodged}</p><button data-action="menu">Weiter</button>`);
  }else{
    show(`<h1>${reason||'Spiel vorbei'}</h1><p>Level ${game.level+1}: ${current().name}</p><p>Punkte: <strong>${game.score}</strong> · Beste Combo: ×${game.bestCombo}</p><button data-action="restart">Nochmal spielen</button><button class="secondary" data-action="menu">Zum Menü</button>`);
  }
}
function sound(freq=440,duration=.09,type='sine'){
  if(!settings.sound)return;
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);
  }catch{}
}
function toggleSound(){
  settings.sound=!settings.sound;
  if(settings.sound){
    sound(660,.12);
    clearInterval(musicTimer);
    const notes=[392,494,587,494,440,523,659,523];
    musicTimer=setInterval(()=>{if(settings.sound&&game.phase==='play')sound(notes[musicStep++%notes.length],.18,'triangle')},550);
  }else{clearInterval(musicTimer);musicTimer=null}
  $('#soundBtn').textContent=settings.sound?'🔊':'🔇';
}
function spawn(){
  const lv=current(),r=Math.random();
  let type='nut';
  if(settings.mode!=='practice'&&lv.hazards&&r>.77)type=r<.86?'stone':r<.94?'wasp':'rotten';
  else if(r<.07)type='apple';
  else if(r<.13)type='carrot';
  game.items.push({x:18+Math.random()*(W-36),y:-25,r:14+Math.random()*5,
    vy:(150+game.time*8)*difficulty[settings.difficulty].fall,
    type,phase:Math.random()*6,rot:Math.random()*6});
}
function collect(it){
  if(['stone','wasp','rotten'].includes(it.type)){
    game.health-=it.type==='stone'?14:it.type==='wasp'?10:8;
    game.combo=0;game.banner='Aua! −'+(it.type==='stone'?14:it.type==='wasp'?10:8);game.bannerTime=.7;
    sound(130,.2,'sawtooth');return;
  }
  if(it.type==='nut'){game.health=Math.min(100,game.health+7);game.score+=1+Math.floor(game.combo/5);game.nuts++;game.combo++;game.bestCombo=Math.max(game.combo,game.bestCombo);sound(540,.08)}
  if(it.type==='apple'){game.health=Math.min(100,game.health+18);game.score+=3;game.combo++;game.bestCombo=Math.max(game.combo,game.bestCombo);sound(700,.12)}
  if(it.type==='carrot'){game.carrot=6;game.score+=2;sound(820,.12)}
}
function bossUpdate(dt){
  if(current().type!=='boss')return;
  game.bossX=W/2+Math.sin(game.time*1.65)*W*.38;
  const bx=game.bossX,by=player.y+player.h*.5,br=player.w*.62;
  if(Math.abs(player.x-bx)<br+player.w*.35){
    game.health-=28*dt*difficulty[settings.difficulty].drain;
    game.combo=0;
  }
}
function goalDone(){
  const lv=current();
  if(lv.type==='nuts')return game.nuts>=lv.target;
  if(lv.type==='health')return game.health>=lv.target;
  if(lv.type==='combo')return game.combo>=lv.target;
  if(lv.type==='boss')return game.nuts>=lv.target&&game.left<=0;
  return game.left<=0;
}
function update(dt){
  game.bannerTime=Math.max(0,game.bannerTime-dt);
  if(game.phase==='countdown'){
    game.countdown-=dt;
    if(game.countdown<=0)game.phase='play';
    return;
  }
  if(game.phase==='transition'){
    if(game.bannerTime<=0){
      if(game.level+1>=levels.length)gameOver(true);
      else startLevel(game.level+1);
    }
    return;
  }
  if(game.phase!=='play')return;

  const practice=settings.mode==='practice',lv=current();
  game.time+=dt;
  if(!practice)game.left-=dt;
  if(!practice)game.health-=dt*(2.8*difficulty[settings.difficulty].drain);
  game.carrot=Math.max(0,game.carrot-dt);

  let dir=(keys.left?-1:0)+(keys.right?1:0);
  if(dir)player.x+=dir*440*(game.carrot>0?1.35:1)*dt;
  else if(player.target!==null)player.x+=(player.target-player.x)*Math.min(1,16*dt);
  player.x=clamp(player.x,player.w/2,W-player.w/2);

  game.spawnTimer=(game.spawnTimer||0)-dt;
  if(game.spawnTimer<=0){spawn();game.spawnTimer=Math.max(.36,.82-game.time*.004)*(0.75+Math.random()*.5)}
  const slow=game.carrot>0?1:1;
  for(let i=game.items.length-1;i>=0;i--){
    const it=game.items[i];it.y+=it.vy*slow*dt;it.phase+=dt*3;
    if(it.type==='wasp')it.x=clamp(it.x+Math.sin(it.phase)*35*dt,it.r,W-it.r);
    const catchY=player.y+player.h*.38;
    if(Math.abs(it.x-player.x)<player.w*.55+it.r*.55&&Math.abs(it.y-catchY)<player.h*.43+it.r*.5){
      collect(it);game.items.splice(i,1);continue;
    }
    if(it.y>H-ground){if(it.type==='nut'){game.health-=1;game.combo=0}else if(['stone','wasp','rotten'].includes(it.type))game.dodged++;game.items.splice(i,1)}
  }
  bossUpdate(dt);
  if(game.health<=0){gameOver(false,'Gesundheit aufgebraucht');return}
  if(goalDone()){finishLevel();return}
  if(!practice&&game.left<=0){
    game.left=0;
    if(lv.type==='boss'&&game.nuts<lv.target)gameOver(false,'Boss-Level nicht geschafft');
    else if(lv.type==='health')gameOver(false,'Zeit abgelaufen');
    else finishLevel();
  }
}
function updateHud(){
  healthBar.style.width=clamp(game.health,0,100)+'%';
  healthBar.style.background=game.health>55?'#22c55e':game.health>25?'#f59e0b':'#ef4444';
  scoreEl.textContent='🌰 '+game.score+(game.combo>=5?' ×'+Math.min(5,1+Math.floor(game.combo/5)):'');
  if(settings.mode==='practice'){
    statusEl.textContent='Übung · '+Math.round(game.health)+' Gesundheit';
    levelName.textContent='Übungsmodus';timerEl.textContent='∞';
    goalText.textContent='Fange Nüsse und probiere die Steuerung aus';goalBar.style.width='0%';return;
  }
  statusEl.textContent=Math.round(game.health)+' Gesundheit';
  const lv=current();levelName.textContent='Level '+(game.level+1)+'/'+levels.length+' · '+lv.name;
  timerEl.textContent=Math.max(0,Math.ceil(game.left))+'s';
  goalText.textContent=lv.goal;
  let p=lv.type==='nuts'?game.nuts/lv.target:lv.type==='health'?game.health/lv.target:lv.type==='combo'?game.combo/lv.target:lv.type==='boss'?.65*(game.nuts/lv.target)+.35*(1-game.left/lv.time):1-game.left/lv.time;
  goalBar.style.width=clamp(p*100,0,100)+'%';
}
function drawBg(){
  const t=themes[settings.theme],g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,t.sky[0]);g.addColorStop(1,t.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(W-58,100,32,0,7);ctx.fill();
  const gy=H-ground;ctx.fillStyle=t.ground;ctx.fillRect(0,gy,W,ground);
  ctx.fillStyle=t.grass;
  for(let x=0;x<W;x+=25){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+7,gy-10);ctx.lineTo(x+15,gy);ctx.fill()}
}
function drawItem(it){
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
  const danger=['stone','wasp','rotten'].includes(it.type);
  if(danger){ctx.strokeStyle='#ef4444aa';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,it.r*1.65,0,7);ctx.stroke();ctx.setLineDash([])}
  if(it.type==='nut'){
    ctx.fillStyle='#a9743f';ctx.beginPath();ctx.ellipse(0,0,it.r*.72,it.r,0,0,7);ctx.fill();
    ctx.strokeStyle='#e5bd82';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-it.r*.4,-3);ctx.quadraticCurveTo(0,5,it.r*.4,-3);ctx.stroke();
  }else if(it.type==='apple'||it.type==='rotten'){
    ctx.fillStyle=it.type==='apple'?'#ef4444':'#79532f';ctx.beginPath();ctx.arc(0,0,it.r*.82,0,7);ctx.fill();
    ctx.fillStyle='#4b7a33';ctx.fillRect(-1,-it.r,3,it.r*.35);
    if(it.type==='apple'){ctx.fillStyle='#fff7';ctx.beginPath();ctx.arc(-it.r*.3,-it.r*.3,3,0,7);ctx.fill()}
  }else if(it.type==='carrot'){
    ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(-it.r*.62,-it.r*.7);ctx.lineTo(it.r*.62,-it.r*.7);ctx.lineTo(0,it.r*1.15);ctx.fill();
    ctx.strokeStyle='#4d8b3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-it.r*.7);ctx.lineTo(-4,-it.r*1.15);ctx.moveTo(0,-it.r*.7);ctx.lineTo(5,-it.r*1.1);ctx.stroke()
  }else if(it.type==='stone'){
    ctx.fillStyle='#626b73';ctx.beginPath();ctx.moveTo(-it.r,-it.r*.5);ctx.lineTo(-it.r*.5,-it.r);ctx.lineTo(it.r*.65,-it.r*.8);ctx.lineTo(it.r,it.r*.3);ctx.lineTo(it.r*.35,it.r);ctx.lineTo(-it.r*.85,it.r*.65);ctx.fill()
  }else{
    ctx.fillStyle='#f4c542';ctx.beginPath();ctx.ellipse(0,0,it.r*.65,it.r*.9,0,0,7);ctx.fill();
    ctx.fillStyle='#202a24';ctx.fillRect(-it.r*.5,0,it.r,4);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-5,-it.r*.3,4,2,-.5,0,7);ctx.ellipse(5,-it.r*.3,4,2,.5,0,7);ctx.fill()
  }
  ctx.restore();
}
function drawPlayer(){
  const x=player.x,y=player.y,h=player.h,w=player.w;
  const color=outfitColors[settings.outfit]||outfitColors[0];
  ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(x,y+h+5,w*.45,5,0,0,7);ctx.fill();
  ctx.strokeStyle='#40536a';ctx.lineWidth=w*.16;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x-w*.18,y+h*.68);ctx.lineTo(x-w*.22,y+h);ctx.moveTo(x+w*.18,y+h*.68);ctx.lineTo(x+w*.22,y+h);ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x-w*.31,y+h*.34,w*.62,h*.4,w*.15);ctx.fill();
  ctx.strokeStyle='#f1c29b';ctx.lineWidth=w*.12;ctx.beginPath();
  ctx.moveTo(x-w*.27,y+h*.4);ctx.lineTo(x-w*.48,y+h*.18);ctx.moveTo(x+w*.27,y+h*.4);ctx.lineTo(x+w*.48,y+h*.18);ctx.stroke();
  ctx.fillStyle='#f1c29b';ctx.beginPath();ctx.arc(x,y+h*.2,w*.22,0,7);ctx.fill();
  ctx.fillStyle='#6b422d';ctx.beginPath();ctx.arc(x,y+h*.16,w*.22,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#263238';ctx.beginPath();ctx.arc(x-w*.07,y+h*.19,2,0,7);ctx.arc(x+w*.07,y+h*.19,2,0,7);ctx.fill();
  ctx.strokeStyle='#263238';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y+h*.24,w*.07,.15,Math.PI-.15);ctx.stroke();
}
function drawBoss(){
  if(game.phase==='menu'||settings.mode==='practice'||current().type!=='boss')return;
  const y=player.y+player.h*.5,x=game.bossX||W/2,r=player.w*.62;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#ffffff26';ctx.beginPath();ctx.arc(0,0,r*1.6,0,7);ctx.fill();
  ctx.fillStyle='#554f4b';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#81776c';ctx.beginPath();ctx.arc(-r*.28,-r*.3,r*.28,0,7);ctx.arc(r*.32,r*.25,r*.2,0,7);ctx.fill();
  ctx.restore();
}
function drawBanner(){
  let text=game.phase==='countdown'?String(Math.max(1,Math.ceil(game.countdown))):game.banner;
  if(game.phase==='countdown'&&game.countdown<.35)text='GO!';
  if(!text||game.bannerTime<=0&&game.phase!=='countdown')return;
  ctx.fillStyle='#173927dd';ctx.beginPath();ctx.roundRect(W/2-140,H*.28-32,280,64,16);ctx.fill();
  ctx.fillStyle='white';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 22px system-ui';ctx.fillText(text,W/2,H*.28);
}
function draw(){
  drawBg();
  for(const it of game.items)drawItem(it);
  drawBoss();drawPlayer();drawBanner();
}
function frame(now){
  if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;
  update(dt);updateHud();draw();requestAnimationFrame(frame)
}

$('#pauseBtn').addEventListener('click',pause);
$('#themeBtn').addEventListener('click',()=>{
  settings.theme=(settings.theme+1)%themes.length;
  $('#themeBtn').textContent=themes[settings.theme].icon;
  if(game.phase==='menu')menu()
});
$('#soundBtn').addEventListener('click',()=>{toggleSound();if(game.phase==='menu')menu()});
card.addEventListener('click',e=>{
  const action=e.target.dataset.action;
  if(action==='start')begin();
  if(action==='resume')pause();
  if(action==='restart')begin();
  if(action==='menu')menu();
  if(action==='theme'){$('#themeBtn').click();menu()}
  if(action==='sound'){toggleSound();menu()}
});
const keys={left:false,right:false};
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
  if(e.key==='Escape')pause()
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false
});
canvas.addEventListener('pointerdown',e=>{
  if(game.phase!=='play')return;dragging=true;player.target=e.clientX;e.preventDefault()
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(game.phase==='play'&&dragging){player.target=e.clientX;e.preventDefault()}
},{passive:false});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointercancel',()=>dragging=false);
window.addEventListener('resize',resize);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

resize();menu();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
